<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 2.7 28 28">
  <!-- The open-book mark from components/Logo.tsx, with the theme's colors
       written in, since a favicon can't read the site's CSS. Browsers that
       support SVG favicons also apply the dark-mode block, so the ribbon
       stays visible on a dark tab bar. -->
  <style>
    .left { fill: #C81D6B; }
    .right { fill: #F29E38; }
    .ribbon { fill: #241B3A; }
    @media (prefers-color-scheme: dark) {
      .left { fill: #FF6FA8; }
      .right { fill: #F5B354; }
      .ribbon { fill: #F8EEF4; }
    }
  </style>
  <path class="left" d="M3 8.5c4.5-2.4 8.8-2.2 12.5.8v17.2c-3.7-2.8-8-3-12.5-.9z"/>
  <path class="right" d="M29 8.5c-4.5-2.4-8.8-2.2-12.5.8v17.2c3.7-2.8 8-3 12.5-.9z"/>
  <path class="ribbon" d="M20.5 7.6v9.2l2.2-1.7 2.2 1.7V6.9c-1.5-.1-3 .1-4.4.7z"/>
</svg>
