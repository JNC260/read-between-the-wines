<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Read Between the Wines</title>
    <base href="/" />
    <meta
      name="description"
      content="An invite-only book club in Paducah. Suggest a book, vote on what's next, and RSVP for the next meeting."
    />

    <!-- The preview card when a link (like an invite) is texted, emailed or
         posted. Link previewers don't run JavaScript, so these have to be in
         the static HTML, and the image URL has to be absolute. The image is
         public/og-image.png; regenerate it with scripts/render-og-image.sh. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Read Between the Wines" />
    <meta property="og:title" content="Read Between the Wines" />
    <meta
      property="og:description"
      content="An invite-only book club in Paducah. Suggest a book, vote on what's next, and RSVP for the next meeting."
    />
    <meta property="og:url" content="https://readbetweenthewinespaducah.org/" />
    <meta property="og:image" content="https://readbetweenthewinespaducah.org/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Read Between the Wines, a Paducah book club, beside a shelf of books and a bottle of wine"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Read Between the Wines" />
    <meta
      name="twitter:description"
      content="An invite-only book club in Paducah. Suggest a book, vote on what's next, and RSVP for the next meeting."
    />
    <meta name="twitter:image" content="https://readbetweenthewinespaducah.org/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Read Between the Wines, a Paducah book club, beside a shelf of books and a bottle of wine"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF6F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1426" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Figtree:ital,wght@0,400..700;1,400..700&family=DM+Mono:wght@500&display=swap"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
